<!doctype html>
<html lang="fr">
{% include head.html %}

<body>
  <!-- Fonds interactifs sur les côtés -->
  <div style="position:fixed; left:0; top:70px; bottom:0; width:calc(50% - 430px); z-index:-1; overflow:hidden; pointer-events:none;">
    <div class="interactive-halo-bg" style="position:absolute; width:100%; height:100%; left:0; top:0;"></div>
  </div>
  <div style="position:fixed; right:0; top:70px; bottom:0; width:calc(50% - 430px); z-index:-1; overflow:hidden; pointer-events:none;">
    <div class="interactive-halo-bg" style="position:absolute; width:100%; height:100%; left:0; top:0; transform:scaleX(-1);"></div>
  </div>

  {% include header.html %}
  <div class="content-wrapper">
    {{ content }}
  </div>
  {% include footer.html %}

  <div class="custom-cursor"></div>
  <div class="noise-overlay"></div>

  <script>
    // Custom Magnetic Cursor
    const cursor = document.querySelector('.custom-cursor');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // Smooth animation loop for the cursor
    function animateCursor() {
      const dx = mouseX - cursorX;
      const dy = mouseY - cursorY;

      cursorX += dx * 0.2;
      cursorY += dy * 0.2;

      cursor.style.left = `${cursorX}px`;
      cursor.style.top = `${cursorY}px`;

      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Magnetic hover effect on all text and interactive elements
    const textElements = document.querySelectorAll('p, h1, h2, h3, h4, h5, h6, span, a, button, input, li, .prog-item');
    // Inverted colors for difference mode to render warm pastels: 
    // #002546 (pêche), #077c86 (corail), #01274e (orange clair), #00969e (rouge pastel), 
    // #2d80c1 (terracotta), #1f2d4c (beige chaud), #0b3d3d (rose pastel), #020269 (jaune pastel)
    const cursorColors = ['#002546', '#077c86', '#01274e', '#00969e', '#2d80c1', '#1f2d4c', '#0b3d3d', '#020269'];

    textElements.forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.classList.add('hovered');
        const randomColor = cursorColors[Math.floor(Math.random() * cursorColors.length)];
        cursor.style.backgroundColor = randomColor;
      });
      el.addEventListener('mouseleave', () => {
        cursor.classList.remove('hovered');
        cursor.style.backgroundColor = '#ffffff';
      });
    });

    // Scroll Reveal Animations
    const observerOptions = {
      root: null,
      rootMargin: '0px',
      threshold: 0.1
    };

    const observer = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, observerOptions);

    // Apply observer to any element with reveal-on-scroll
    const revealElements = document.querySelectorAll('.reveal-on-scroll');
    revealElements.forEach(el => {
      observer.observe(el);
    });
  </script>
</body>

</html>
